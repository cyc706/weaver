name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}  # 服务器IP地址
          username: ${{ secrets.SERVER_USER }}  # 服务器用户名
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # SSH私钥
          script: |
            cd /root/weaver
            git pull
            npm install
            npm run build
            pm2 restart weaver || pm2 start npm --name "weaver" -- start